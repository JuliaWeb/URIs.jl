name: CI
on:
  push:
    branches: [main, master]
    tags: ["*"]
  pull_request:
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1' # automatically expands to the latest stable 1.x release of Julia
          - 'min'
          - 'pre'
        os:
          - ubuntu-latest
          - windows-latest
        arch:
          - x64
        include:
          - os: macOS-latest
            arch: aarch64
            version: 1
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/julia-buildpkg@latest
      - uses: julia-actions/julia-docdeploy@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  native:
    name: Native path normalization
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.13'
      - uses: julia-actions/cache@v2
      - name: Install native test dependencies
        run: julia --startup-file=no --project=test/trim -e 'using Pkg; Pkg.develop(path=pwd()); Pkg.instantiate()'
      - name: Compile and exercise runtime paths
        run: |
          julia --startup-file=no --project=test/trim -e 'using JuliaC; JuliaC.main(ARGS)' -- --output-exe uri-normalize --project=test/trim --experimental --trim=safe test/trim/path_normalization.jl
          JULIA_LOAD_CODEGEN_LIB=0 ./uri-normalize '/a/b/../c' '/a/c'
          JULIA_LOAD_CODEGEN_LIB=0 ./uri-normalize './...' '...'
          JULIA_LOAD_CODEGEN_LIB=0 ./uri-normalize '/a//b/../' '/a//'
          JULIA_LOAD_CODEGEN_LIB=0 ./uri-normalize '/é/./🌟/../%2e' '/é/%2e'
          JULIA_LOAD_CODEGEN_LIB=0 ./uri-normalize '' ''
